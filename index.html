<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Portal de Acessos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root{--bg-radial-top:#151821;--bg-radial-mid:#050814;--bg-radial-end:#02030a;--bg-card:#0b1020;--bg-card-soft:#101629;--accent:#ff7a1a;--accent-soft:#ff9b4a;--text:#f5f7ff;--text-soft:#c2c7ff;--border-card:rgba(255,154,74,.25);--border-card-hover:#ff9b4a;--overlay-bg:rgba(11,16,32,.78);--input-bg:rgba(5,8,20,.55);--input-placeholder:rgba(194,199,255,.55);--title-color:#ff9b4a;--danger:#ff6b6b;--success:#54d18a;--shadow-login:0 18px 60px rgba(0,0,0,.55);--shadow-card:0 10px 24px rgba(0,0,0,.12)}
    body.light-mode{--bg-radial-top:#eef1f5;--bg-radial-mid:#e2e7ee;--bg-radial-end:#d7dde6;--bg-card:#ffffff;--bg-card-soft:#f5f7fa;--text:#1e293b;--text-soft:#64748b;--border-card:rgba(255,122,26,.26);--border-card-hover:#ff7a1a;--overlay-bg:rgba(248,250,252,.96);--input-bg:#ffffff;--input-placeholder:rgba(100,116,139,.72);--title-color:#ff7a1a;--shadow-login:0 18px 60px rgba(148,163,184,.16);--shadow-card:0 10px 24px rgba(148,163,184,.14)}
    *{box-sizing:border-box}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at top,var(--bg-radial-top) 0,var(--bg-radial-mid) 45%,var(--bg-radial-end) 100%);color:var(--text);margin:0;padding:24px;min-height:100vh;transition:background .2s ease,color .2s ease}.top-actions{max-width:1150px;margin:0 auto 12px auto;display:flex;gap:10px;justify-content:flex-end;align-items:center;position:relative;z-index:10001}.theme-toggle,.logout-btn,.small-btn{border:1px solid var(--border-card);background:var(--bg-card);color:var(--text);border-radius:999px;padding:10px 16px;cursor:pointer;font-size:13px;font-weight:700;transition:.15s;box-shadow:var(--shadow-card)}.logout-btn{display:none}.theme-toggle:hover,.logout-btn:hover,.small-btn:hover{transform:translateY(-1px);background:var(--bg-card-soft);border-color:var(--border-card-hover)}
    .login-overlay{position:fixed;inset:0;background:radial-gradient(circle at top,var(--bg-radial-top) 0,var(--bg-radial-mid) 45%,var(--bg-radial-end) 100%);display:flex;align-items:center;justify-content:center;z-index:9999;padding:24px}.login-box{width:min(720px,92vw);padding:56px 64px;border-radius:18px;background:var(--overlay-bg);border:1px solid rgba(255,154,74,.22);box-shadow:var(--shadow-login);text-align:center;backdrop-filter:blur(6px)}.logo-frame{display:inline-flex;align-items:center;justify-content:center;padding:0;border-radius:0;background:transparent;border:none;box-shadow:none;margin:0 auto 18px auto}.logo-frame.header-logo-frame{margin-bottom:14px}.login-logo,.logo{display:block;object-fit:contain;filter:none!important;mix-blend-mode:normal!important;opacity:1!important;background:transparent!important}.login-logo{width:190px;max-width:80%;margin:0}.logo{width:180px;margin:0}.login-title{font-size:34px;font-weight:800;margin:0 0 10px 0;letter-spacing:.2px}.login-subtitle,.subtitle,.link-meta{color:var(--text-soft)}.login-subtitle{margin:0 0 26px 0;font-size:14px}.login-row,.admin-form{display:grid;gap:14px;margin-top:8px;justify-items:center}.login-input,input,select,textarea{width:100%;border-radius:14px;border:1px solid rgba(255,154,74,.22);background:var(--input-bg);color:var(--text);padding:12px 14px;outline:none;font-size:14px}textarea{min-height:82px;resize:vertical}.login-input{width:min(520px,100%);height:52px}.login-input::placeholder,input::placeholder,textarea::placeholder{color:var(--input-placeholder)}.login-btn{width:min(520px,100%);height:54px;border-radius:999px;border:none;cursor:pointer;font-weight:800;font-size:15px;color:#050814;background:linear-gradient(135deg,var(--accent),var(--accent-soft));transition:.15s;box-shadow:var(--shadow-card)}.login-btn.compact{width:auto;min-width:180px;height:44px}.login-error{display:none;margin-top:8px;font-size:12px;color:var(--danger)}.link-btn{background:transparent;border:none;color:var(--text-soft);font-size:13px;cursor:pointer;text-decoration:underline;padding:4px 0}.link-btn:hover{color:var(--accent-soft)}
    .container{max-width:1150px;margin:auto;display:none}header{text-align:center;margin-bottom:30px}.user-line{margin-top:8px;color:var(--text-soft);font-size:13px}h1{font-size:24px;margin:10px 0 4px 0}.main-menu{margin:24px 0;display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.menu-btn{padding:12px 14px;border-radius:999px;border:1px solid rgba(255,154,74,.3);background:linear-gradient(135deg,rgba(255,122,26,.12),rgba(5,8,20,.95));color:var(--text);font-size:15px;font-weight:600;cursor:pointer;transition:.15s}body.light-mode .menu-btn{background:#fff;box-shadow:var(--shadow-card)}.menu-btn.active{background:linear-gradient(135deg,var(--accent),var(--accent-soft));color:#050814}.menu-btn:hover{transform:translateY(-2px);border-color:var(--accent-soft)}.section{margin-bottom:28px}.hidden{display:none}.section-title{font-size:18px;margin-bottom:14px;color:var(--title-color)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.link-card,.empty-card,.loading-card,.admin-card{padding:14px;background:var(--bg-card);border-radius:12px;border:1px solid var(--border-card);text-decoration:none;color:var(--text);transition:.15s;display:block;box-shadow:var(--shadow-card)}.link-card:hover{transform:translateY(-2px);background:var(--bg-card-soft);border-color:var(--border-card-hover)}.link-title{font-size:15px;font-weight:600}.link-meta{font-size:11px}
    .admin-panel{display:grid;gap:14px}.admin-tabs{display:flex;flex-wrap:wrap;gap:8px}.admin-tab{border:1px solid var(--border-card);background:var(--bg-card);color:var(--text);border-radius:999px;padding:10px 14px;cursor:pointer;font-weight:700}.admin-tab.active{background:linear-gradient(135deg,var(--accent),var(--accent-soft));color:#050814}.admin-card h3{margin:0 0 8px 0}.admin-hint{color:var(--text-soft);font-size:13px;margin:0 0 14px 0}.admin-form{grid-template-columns:repeat(auto-fit,minmax(210px,1fr));align-items:start;justify-items:stretch}.admin-form textarea,.admin-form button{grid-column:1/-1}.admin-message{margin-top:10px;color:var(--text-soft);font-size:13px}.admin-message.error{color:var(--danger)}.admin-message.success{color:var(--success)}.admin-table-wrap{overflow:auto}.admin-table{width:100%;border-collapse:collapse;font-size:13px}.admin-table th,.admin-table td{border-bottom:1px solid var(--border-card);padding:9px;text-align:left;vertical-align:middle}.admin-table th{color:var(--title-color)}.admin-table input,.admin-table select{min-width:120px;padding:9px;border-radius:10px}.permission-matrix{display:grid;gap:12px;margin-top:14px}.permission-module{border:1px solid var(--border-card);border-radius:12px;padding:12px;background:rgba(255,255,255,.02)}.check-row{display:flex;gap:8px;align-items:center;margin:8px 0;color:var(--text)}.check-row input{width:auto}.check-row span{color:var(--text-soft);font-size:12px}.check-row.resource{padding-left:22px;color:var(--text-soft)}code{white-space:pre-wrap;color:var(--text-soft)}
    @media (max-width:900px){.main-menu{grid-template-columns:repeat(2,1fr)}}@media (max-width:560px){body{padding:16px}.login-box{padding:36px 24px}.login-title{font-size:28px}.main-menu{grid-template-columns:1fr}.logo,.login-logo{width:150px}.admin-tabs{display:grid}.admin-form{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="top-actions"><button class="theme-toggle" id="themeToggle" type="button">Modo claro</button><button class="logout-btn" id="logoutBtn" type="button">Sair</button></div>
  <div class="login-overlay" id="loginOverlay"><div class="login-box"><div class="logo-frame"><img src="./logo-areia-ana.png" class="login-logo" alt="Logo Areia Ana" /></div><div class="login-title">Portal de Acessos</div><div class="login-subtitle">Acesso restrito com usuário e senha</div><form id="loginForm" class="login-row"><input class="login-input" type="text" id="email" placeholder="Usuário" autocomplete="username" required /><input class="login-input" type="password" id="senha" placeholder="Senha" autocomplete="current-password" required /><button class="login-btn" type="submit">Entrar</button><button class="link-btn" type="button" id="forgotLinkBtn">Esqueci minha senha</button><div class="login-error" id="erroLogin">Não foi possível entrar.</div></form><form id="forgotForm" class="login-row hidden"><div class="login-subtitle">Informe seu e-mail para receber o link de redefinição de senha.</div><input class="login-input" type="email" id="forgotEmail" placeholder="E-mail" autocomplete="username" required /><button class="login-btn" type="submit">Enviar link de redefinição</button><button class="link-btn" type="button" id="backToLoginBtn">Voltar para o login</button><div class="admin-message" id="forgotMsg"></div></form><form id="resetForm" class="login-row hidden"><div class="login-title" style="font-size:22px;">Criar nova senha</div><input class="login-input" type="password" id="novaSenha" placeholder="Nova senha" autocomplete="new-password" required /><input class="login-input" type="password" id="confirmaSenha" placeholder="Confirmar nova senha" autocomplete="new-password" required /><button class="login-btn" type="submit">Salvar nova senha</button><div class="admin-message" id="resetMsg"></div></form></div></div>
  <div class="container" id="portal"><header><div class="logo-frame header-logo-frame"><img src="./logo-areia-ana.png" class="logo" alt="Logo Areia Ana"></div><h1>Portal de Acessos</h1><p class="subtitle">Escolha uma área e clique para abrir o painel ou sistema.</p><div class="user-line">Usuário: <strong id="userName"></strong> · Perfil: <strong id="userRole"></strong></div></header><div class="main-menu" id="mainMenu"></div><div id="sectionsRoot"></div></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./assets/js/config.js"></script>
  <script src="./assets/js/supabase-client.js"></script>
  <script src="./assets/js/auth.js"></script>
  <script src="./assets/js/admin.js"></script>
  <script src="./assets/js/portal.js"></script>
</body>
</html>
